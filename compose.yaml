services:
  audiocpp:
    container_name: audiocpp
    build:
      context: .
      dockerfile: .devops/cuda.Dockerfile
      target: full
      args:
        CUDA_VERSION: 12.9.2
        UBUNTU_VERSION: 24.04
        CUDA_DOCKER_ARCH: "86-real"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/app/models
      - ./output:/app/output
    command:
      - server
      - --ui
      - --ui-management
      - --backend
      - cuda
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --generation-dir
      - /app/output/generations
      - --max-loaded-models
      - "1"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: "2gb"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: audiocpp-cloudflared
    profiles: [remote]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - audiocpp
